<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Live Chart | StratBoonCo</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <!-- TradingView Charting Library -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: rgba(30, 41, 59, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
        }

        .asset-title {
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #f8fafc;
        }

        .chart-wrapper {
            flex: 1;
            position: relative;
            background: #0f172a;
        }

        #tv-chart-container {
            width: 100%;
            height: 100%;
        }

        .close-hint {
            font-size: 12px;
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(15,23,42,0.4);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <span class="brand">StratBoonCo</span>
            <span style="color: rgba(255,255,255,0.15)">|</span>
            <h1 class="asset-title" id="asset-display-name">Loading Live Chart...</h1>
        </div>
        <span class="close-hint">Tab view</span>
    </header>

    <div class="chart-wrapper">
        <div id="tv-chart-container"></div>
    </div>

    <script>
        // Parse parameters from query URL
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name') || 'Asset';
        const symbol = urlParams.get('symbol');

        if (!symbol) {
            document.getElementById('asset-display-name').textContent = "Symbol parameter missing";
            document.getElementById('tv-chart-container').innerHTML = '<div style="padding: 40px; text-align:center; color:#94a3b8;">Error: No market symbol provided.</div>';
        } else {
            // Update page titles
            document.title = `${name} Live Chart | StratBoonCo`;
            document.getElementById('asset-display-name').textContent = `${name} (${symbol.split(':').pop()})`;

            // Load TradingView Widget
            new TradingView.widget({
                "width": "100%",
                "height": "100%",
                "symbol": symbol,
                "interval": "D",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "container_id": "tv-chart-container"
            });
        }
    </script>
</body>
</html>
